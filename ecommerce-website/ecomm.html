<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#f4f4f4;
        margin:0;
        padding:0;
    }

    header{
        background:#222;
        color:white;
        text-align:center;
        padding:20px;
        font-size:28px;
        letter-spacing:1px;
    }

    .container{
        width:80%;
        margin:30px auto;
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-bottom:20px;
    }

    th, td{
        border:1px solid #ccc;
        padding:12px;
        text-align:center;
    }

    th{
        background:#eee;
    }

    .btn{
        background:#28a745;
        color:white;
        padding:10px 20px;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    .btn:hover{
        background:#218838;
    }

    .payment-box, .captcha-box{
        margin-top:20px;
        padding:15px;
        border:1px solid #ccc;
        border-radius:10px;
        background:#fafafa;
    }

    .submit-btn{
        margin-top:20px;
        background:#007bff;
    }

    .submit-btn:hover{
        background:#0062cc;
    }
</style>
</head>

<body>

<header>
    My Online Store
</header>

<div class="container">

    <h2>Shopping Cart</h2>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Add</th>
        </tr>

        <tr>
            <td>Product 1</td>
            <td>$10</td>
            <td><input type="number" min="1" value="1"></td>
            <td><button class="btn">Add to Cart</button></td>
        </tr>

        <tr>
            <td>Product 2</td>
            <td>$15</td>
            <td><input type="number" min="1" value="1"></td>
            <td><button class="btn">Add to Cart</button></td>
        </tr>

        <tr>
            <td>Product 3</td>
            <td>$20</td>
            <td><input type="number" min="1" value="1"></td>
            <td><button class="btn">Add to Cart</button></td>
        </tr>
    </table>

    <div class="payment-box">
        <h3>Payment Options</h3>
        <label><input type="radio" name="payment"> Credit / Debit Card</label><br>
        <label><input type="radio" name="payment"> UPI</label><br>
        <label><input type="radio" name="payment"> Net Banking</label><br>
        <label><input type="radio" name="payment"> Cash on Delivery</label>
    </div>

    <div class="captcha-box">
        <h3>Captcha Verification</h3>
        <label><input type="checkbox"> I'm not a robot</label>
    </div>

    <button class="btn submit-btn">Place Order</button>

</div>

</body>
</html>
