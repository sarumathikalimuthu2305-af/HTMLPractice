<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <style>
        *{
            margin:5px;
            padding:0;
            box-sizing:border-box;
        }
        img{
            width:100%;
            height:90vh;
        }
        #prev{
            color:white;
            position:absolute;
            top:40%;
            left:5%;
            font-size: 3em;
        }
        next{
            color:white;
            position:absolute;
            top:40%;
            left:5%;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div>
        <img src="" alt="">
        <h1 id="prev"></h1>
        <h1 id="next"></h1>
    </div>
    
    <script src="./carousel.js"></script>
</body>
</html>
